services:
  db:
    image: mysql:8.0
    container_name: gameforge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: gameforge_course
      MYSQL_USER: forge_user
      MYSQL_PASSWORD: forge_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "forge_user", "-pforge_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: gameforge_api
    restart: always
    ports:
      - "8001:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: forge_user
      MYSQL_PASSWORD: forge_password
      MYSQL_DATABASE: gameforge_course
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
